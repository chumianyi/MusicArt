plugins {
    id 'com.android.application'
}

android {
    namespace 'com.musicart.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.musicart.player"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // 刻意不引入任何第三方库：网络用 HttpURLConnection，图片加载自写 LruCache，
    // 播放器用 MediaPlayer。全部 UI 为自定义 View onDraw 手绘。
}
